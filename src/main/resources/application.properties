server.port=${PORT:8082}
server.address=${HONEYGRID_BIND_ADDRESS:127.0.0.1}
spring.application.name=honeygrid
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/honeygrid;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
server.tomcat.max-http-form-post-size=16KB
server.max-http-request-header-size=16KB
honeygrid.admin.username=${HONEYGRID_ADMIN_USERNAME:operator}
honeygrid.admin.password=${HONEYGRID_ADMIN_PASSWORD:}
honeygrid.agent.api-key=${HONEYGRID_AGENT_API_KEY:}
honeygrid.ssh.enabled=${HONEYGRID_SSH_ENABLED:true}
honeygrid.ssh.bind-address=${HONEYGRID_SSH_BIND_ADDRESS:127.0.0.1}
honeygrid.ssh.port=${HONEYGRID_SSH_PORT:2222}
honeygrid.canary.base-url=${HONEYGRID_CANARY_BASE_URL:http://localhost:8082}
honeygrid.retention-days=${HONEYGRID_RETENTION_DAYS:30}
